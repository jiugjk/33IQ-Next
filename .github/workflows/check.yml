name: Check

on:
  push:
    branches: [ main ] # Just in case main was not up to date while merging PR
  pull_request:
    types: [ opened, synchronize ]

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Passed straight through to Gradle, which reads them in app/build.gradle.kts. Secrets that are
    # not configured arrive as empty strings, and the build treats that as "no signing material" -
    # which is also what a pull request from a fork gets, since secrets are withheld from those.
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The keystore only ever exists in the runner's temp directory, for the length of this job.
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # Release is built too, so R8/resource shrinking - which only runs for that build type - is
      # checked on every pull request rather than discovered when a release is actually needed.
      - name: Build App
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-build-cache

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v5
        with:
          # A glob, because the file is app-release.apk when the signing secrets are configured and
          # app-release-unsigned.apk when they are not.
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: lintDebug
        run: ./gradlew lint

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results*.html
            feature/*/build/reports/lint-results*.html
            library/*/build/reports/lint-results*.html

  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: detekt
        run: ./gradlew detektCheck

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: detekt-report
          path: |
            build/reports/detekt/detekt.*
            app/build/reports/detekt/detekt.*
            feature/*/build/reports/detekt/detekt.*
            library/*/build/reports/detekt/detekt.*
            konsist-test/build/reports/detekt/detekt.*

  konsist:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: konsist
        run: ./gradlew konsist-test:test --rerun-tasks

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: konsist-report
          path: ./konsist-test/build/reports/*

  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: spotlessCheck
        run: ./gradlew spotlessCheck

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spotless-report
          path: |
            build/reports/spotless/*
            app/build/reports/spotless/*
            feature/*/build/reports/spotless/*
            library/*/build/reports/spotless/*
            konsist-test/build/reports/spotless/*

