name: Build

# Manually-triggerable build, independent of Check.yml (which only runs on push to main / PRs).
# Useful for getting installable APKs - and verifying a feature branch really packages - before
# opening a PR. Tick "Publish GitHub Release" (or push a v* tag) to attach the release APK to
# GitHub Releases instead of leaving it only as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the release APK as a GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# contents:write is required to create/update a GitHub Release. Artifact uploads still work with it.
permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    # Passed straight through to Gradle, which reads them in app/build.gradle.kts. Secrets that are
    # not configured arrive as empty strings, and the build treats that as "no signing material".
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The keystore only ever exists in the runner's temp directory, for the length of this job.
      # Without the secret - a pull request from a fork, or a clone that has not configured one -
      # this step is skipped and the release APK simply comes out unsigned, so nothing fails.
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Compile all source sets (fast fail, no packaging)
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          # A glob, because the file is app-release.apk when the signing secrets are configured and
          # app-release-unsigned.apk when they are not. The R8 mapping rides along: without it a
          # crash report from this build is unreadable.
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/release/*.apk)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release APK to publish" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(awk -F '"' '/versionName = / { print $2; exit }' app/build.gradle.kts)"
            if [[ -z "${version}" ]]; then
              echo "Could not read versionName from app/build.gradle.kts" >&2
              exit 1
            fi
            tag="v${version}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading assets."
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "${tag}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
