name: Build

# Manually-triggerable build, independent of Check.yml (which only runs on push to main / PRs).
# Useful for getting installable APKs - and verifying a feature branch really packages - before
# opening a PR.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    # Passed straight through to Gradle, which reads them in app/build.gradle.kts. Secrets that are
    # not configured arrive as empty strings, and the build treats that as "no signing material".
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The keystore only ever exists in the runner's temp directory, for the length of this job.
      # Without the secret - a pull request from a fork, or a clone that has not configured one -
      # this step is skipped and the release APK simply comes out unsigned, so nothing fails.
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Compile all source sets (fast fail, no packaging)
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          # A glob, because the file is app-release.apk when the signing secrets are configured and
          # app-release-unsigned.apk when they are not. The R8 mapping rides along: without it a
          # crash report from this build is unreadable.
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
