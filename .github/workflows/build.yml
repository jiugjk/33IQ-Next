name: Build

# Manually-triggerable build, independent of Check.yml (which only runs on push to main / PRs).
# Every workflow_dispatch run publishes a NEW GitHub Release (next v* patch), so you do not
# have to tick a box or push a tag. Pushing a v* tag still builds and publishes that tag.
# Feature branches matching claude/** only upload workflow artifacts.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# contents:write is required to create/update a GitHub Release. Artifact uploads still work with it.
permissions:
  contents: write

jobs:
  # gh release create from workflow_dispatch also pushes a v* tag, which would otherwise
  # start a second full build. Skip that duplicate if the release is already there.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] && gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping duplicate tag build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  compile:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # Passed straight through to Gradle, which reads them in app/build.gradle.kts. Secrets that are
    # not configured arrive as empty strings, and the build treats that as "no signing material".
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The keystore only ever exists in the runner's temp directory, for the length of this job.
      # Without the secret - a pull request from a fork, or a clone that has not configured one -
      # this step is skipped and the release APK simply comes out unsigned, so nothing fails.
      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve release version
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            latest="$(
              gh release list --limit 100 --json tagName --jq '.[].tagName' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -1 || true
            )"
            if [[ -z "${latest}" ]]; then
              version="0.0.1"
            else
              IFS=. read -r maj min pat <<< "${latest#v}"
              version="${maj}.${min}.$((pat + 1))"
            fi
            tag="v${version}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver version '${version}'" >&2
            exit 1
          fi

          IFS=. read -r maj min pat <<< "${version}"
          version_code=$((maj * 10000 + min * 100 + pat))

          {
            echo "RELEASE_TAG=${tag}"
            echo "VERSION_NAME=${version}"
            echo "VERSION_CODE=${version_code}"
          } >> "$GITHUB_ENV"

          echo "Publishing as ${tag} (versionName=${version}, versionCode=${version_code})"

      - name: Compile all source sets (fast fail, no packaging)
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          # A glob, because the file is app-release.apk when the signing secrets are configured and
          # app-release-unsigned.apk when they are not. The R8 mapping rides along: without it a
          # crash report from this build is unreadable.
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/release/*.apk)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release APK to publish" >&2
            exit 1
          fi

          tag="${RELEASE_TAG:?}"
          published=()
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            dir="$(dirname "$f")"
            case "$base" in
              app-release-unsigned.apk)
                dest="${dir}/33IQ-Next-${VERSION_NAME}-unsigned.apk"
                mv "$f" "$dest"
                published+=("$dest")
                ;;
              app-release.apk)
                dest="${dir}/33IQ-Next-${VERSION_NAME}.apk"
                mv "$f" "$dest"
                published+=("$dest")
                ;;
              *)
                published+=("$f")
                ;;
            esac
          done

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading assets."
            gh release upload "${tag}" "${published[@]}" --clobber
          else
            gh release create "${tag}" "${published[@]}" \
              --title "${tag}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
