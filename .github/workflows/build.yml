name: Build

# Manually-triggerable compile check, independent of Check.yml (which only runs on push to main / PRs).
# Useful for verifying a feature branch actually compiles before opening a PR.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile all source sets (fast fail, no packaging)
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
